<!-- Deliberately the failing case for `read <file>.svg:img`. -->
<!-- The native rasterizer does not resolve theme tokens, so every -->
<!-- currentColor stroke and fill below comes out blank. chart.svg is the -->
<!-- passing counterpart: same drawing, explicit colors. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img">
  <title>Daily values, 14 to 25 (theme tokens - renders blank through read :img)</title>
  <rect x="0" y="0" width="320" height="160" fill="currentColor"/>
  <line x1="40" y1="20" x2="40" y2="130" stroke="currentColor" stroke-width="1"/>
  <line x1="40" y1="130" x2="300" y2="130" stroke="currentColor" stroke-width="1"/>
  <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
            points="40,114.3 68.9,122.1 97.8,82.9 126.7,59.3 155.6,75 184.4,98.6 213.3,51.4 242.2,27.9 271.1,35.7 300,67.1"/>
  <circle cx="40" cy="114.3" r="2.5" fill="currentColor"/>
  <circle cx="68.9" cy="122.1" r="2.5" fill="currentColor"/>
  <circle cx="97.8" cy="82.9" r="2.5" fill="currentColor"/>
  <circle cx="126.7" cy="59.3" r="2.5" fill="currentColor"/>
  <circle cx="155.6" cy="75" r="2.5" fill="currentColor"/>
  <circle cx="184.4" cy="98.6" r="2.5" fill="currentColor"/>
  <circle cx="213.3" cy="51.4" r="2.5" fill="currentColor"/>
  <circle cx="242.2" cy="27.9" r="2.5" fill="currentColor"/>
  <circle cx="271.1" cy="35.7" r="2.5" fill="currentColor"/>
  <circle cx="300" cy="67.1" r="2.5" fill="currentColor"/>
  <text x="40" y="14" font-family="monospace" font-size="11" fill="currentColor">daily values</text>
  <text x="20" y="134" font-family="monospace" font-size="9" fill="currentColor">12</text>
  <text x="20" y="24" font-family="monospace" font-size="9" fill="currentColor">26</text>
</svg>
